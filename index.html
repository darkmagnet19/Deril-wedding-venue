
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10082b">
<title>Deril &amp; Claudia — Wedding Venues</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
  background: #10082b;
  color: #fff;
  font-family: Arial, Helvetica, sans-serif;
}

main {
  width: 100%;
  max-width: 1200px;
  margin: 0 auto;
}

.poster-wrap {
  position: relative;
  width: 100%;
  line-height: 0;
  isolation: isolate;
}

.poster {
  display: block;
  width: 100%;
  height: auto;
}

.venue-links {
  position: absolute;
  z-index: 5;
  top: 52%;
  right: 0.15%;
  left: auto;
  width: 43%;

  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: clamp(12px, 1.4vw, 20px);

  line-height: 1.2;
}

.venue-button {
  min-height: 0;
  height: auto;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;

  gap: clamp(8px, 1vw, 14px);
  padding: clamp(12px, 1.4vw, 18px) 10px;

  border: 2px solid rgba(255, 255, 255, .95);
  border-radius: 18px;

  color: #fff;
  text-decoration: none;
  text-align: center;
  font-weight: 700;

  box-shadow:
    0 0 18px #ff168b88,
    inset 0 0 20px #ffffff20;

  background: linear-gradient(
    110deg,
    rgba(255, 10, 125, .66),
    rgba(184, 16, 111, .60)
  );

  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}

.venue-button.evening {
  background: linear-gradient(
    110deg,
    rgba(41, 75, 255, .48),
    rgba(36, 22, 145, .44)
  );

  box-shadow:
    0 0 18px #3166ff99,
    inset 0 0 20px #ffffff20;
}

.venue-button .church-dp {
  display: block;
  flex: 0 0 clamp(160px, 24vw, 260px);

  width: clamp(160px, 24vw, 260px);
  height: clamp(160px, 24vw, 260px);

  object-fit: cover;
  border-radius: 50%;

  border: 2px solid #ffe7f7;
  box-shadow: 0 0 12px #fff8;
}

.venue-button .venue-copy {
  display: flex;
  min-width: 0;
  width: 100%;

  flex-direction: column;
  align-items: center;

  gap: clamp(6px, .7vw, 9px);
}

.venue-button .label {
  font-size: clamp(17px, 1.8vw, 21px);
  letter-spacing: .07em;
  text-transform: uppercase;
}

.venue-button .name {
  font: 700 clamp(21px, 2.4vw, 28px)/1.15 Georgia, serif;
}

.venue-button .time {
  font-size: clamp(17px, 1.8vw, 21px);
  font-weight: 600;
}

.venue-button:hover {
  filter: brightness(1.15);
  transform: translateY(-2px);
}

.venue-button:focus-visible {
  outline: 4px solid white;
  outline-offset: 4px;
}

@media (max-width: 480px) {
  .venue-links {
    top: 51.5%;
    right: 1%;
    left: auto;
    width: 47%;
    gap: 10px;
  }

  .venue-button {
    padding: 10px 5px;
    border-radius: 12px;
    min-height: 0;
    height: auto;
    gap: 7px;
    border-width: 1.5px;
  }

  .venue-button .church-dp {
    flex-basis: clamp(120px, 24vw, 180px);
    width: clamp(120px, 24vw, 180px);
    height: clamp(120px, 24vw, 180px);
    border-width: 1.5px;
  }

  .venue-button .venue-copy {
    gap: 5px;
  }

  .venue-button .label {
    font-size: clamp(14px, 2.9vw, 16px);
    letter-spacing: .025em;
  }

  .venue-button .name {
    font-size: clamp(17px, 3.6vw, 20px);
  }

  .venue-button .time {
    font-size: clamp(14px, 2.9vw, 16px);
  }
}

@media (prefers-reduced-motion: reduce) {
  .venue-button {
    transition: none;
  }

  .venue-button:hover {
    transform: none;
  }
}
</style>
</head>

<body>
<main>
  <section class="poster-wrap" aria-label="Wedding invitation with venue links">

    <img
      class="poster"
      src="assets/wedding-poster-full.png"
      alt="Deril and Claudia wedding invitation, neon sunset city theme"
    >

    <nav class="venue-links" aria-label="Choose wedding venue">

      <!-- Morning Venue -->
      <a
        class="venue-button morning"
        href="https://maps.app.goo.gl/A8oiDkmiXY1B1y1b9?g_st=ac"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Open morning venue, C.S.I. District Church, Seynamvilai, at 9:30 AM in Google Maps"
      >
        <img
          class="church-dp"
          src="assets/morning-church.jpg"
          alt=""
        >

        <span class="venue-copy">
          <span class="label">☀ Morning Venue</span>

          <span class="name">
            C.S.I. District Church
          </span>

          <span class="time">
            Seynamvilai · 9:30 AM
          </span>
        </span>
      </a>

      <!-- Evening Venue -->
      <a
        class="venue-button evening"
        href="https://maps.app.goo.gl/zTjJWnnDLkzsTxw8A"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Open evening venue, C.S.I. Community Hall, Devicode, at 5:00 PM onwards in Google Maps"
      >
        <img
          class="church-dp"
          src="assets/evening-church.jpg"
          alt=""
        >

        <span class="venue-copy">
          <span class="label">☾ Evening Venue</span>

          <span class="name">
            C.S.I. Community Hall
          </span>

          <span class="time">
            Devicode · 5:00 PM onwards
          </span>
        </span>
      </a>

    </nav>
  </section>
</main>
</body>
</html>
